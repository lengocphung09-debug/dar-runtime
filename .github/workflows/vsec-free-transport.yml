name: VSEC free transport bridge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vsec-free-transport.yml'
permissions:
  contents: write
jobs:
  shard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download canonical VSEC and verify identity
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 -o VSEC.jsonl https://raw.githubusercontent.com/VSEC2021/VSEC/main/Dataset/VSEC.jsonl
          test "$(wc -c < VSEC.jsonl)" -eq 25130457
          test "$(wc -l < VSEC.jsonl)" -eq 9341
          python - <<'PY'
          import hashlib
          b=open('VSEC.jsonl','rb').read()
          assert hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()=='89c7be332a460a9e2fee243f52fa13edbb7bd7ce'
          print(hashlib.sha256(b).hexdigest())
          PY
      - name: Encode lossless connector transport
        run: |
          rm -rf vsec_transport_b64
          mkdir vsec_transport_b64
          gzip -n -c VSEC.jsonl > /tmp/VSEC.jsonl.gz
          base64 -w0 /tmp/VSEC.jsonl.gz > /tmp/VSEC.b64
          split -d -a 3 -b 100000 --additional-suffix=.b64 /tmp/VSEC.b64 vsec_transport_b64/part_
          sha256sum VSEC.jsonl > vsec_transport_b64/CANONICAL_SHA256.txt
          wc -c -l VSEC.jsonl > vsec_transport_b64/CANONICAL_COUNTS.txt
          printf '%s\n' '89c7be332a460a9e2fee243f52fa13edbb7bd7ce' > vsec_transport_b64/CANONICAL_GIT_BLOB_SHA1.txt
      - name: Commit transport
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add vsec_transport_b64
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Materialize lossless canonical VSEC transport"
          git push
